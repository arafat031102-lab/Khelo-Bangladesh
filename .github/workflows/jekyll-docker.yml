<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BD লাইভ TV</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  :root {
    --green: #006a4e;
    --red: #f42a41;
    --dark: #0a0f0d;
    --card: #111a16;
    --border: #1e3028;
    --text: #e8f5ee;
    --muted: #6b9980;
    --glow: rgba(0,106,78,0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Hind Siliguri', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #001a10 0%, #00391f 100%);
    border-bottom: 2px solid var(--green);
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 30px rgba(0,106,78,0.4);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-flag {
    width: 40px;
    height: 26px;
    background: var(--green);
    border-radius: 3px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .logo-flag::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    background: var(--red);
    border-radius: 50%;
    top: 50%;
    left: 52%;
    transform: translate(-50%, -50%);
  }

  .logo-text {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
  }

  .logo-text span { color: var(--red); }

  .live-badge {
    background: var(--red);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 3px;
    letter-spacing: 2px;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .channel-count {
    color: var(--muted);
    font-size: 13px;
  }

  /* CATEGORY TABS */
  .categories {
    background: #0c1610;
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .categories::-webkit-scrollbar { display: none; }

  .cat-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 12px 16px;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }

  .cat-btn:hover { color: var(--text); }

  .cat-btn.active {
    color: #4fffb0;
    border-bottom-color: #4fffb0;
  }

  /* PLAYER */
  .player-section {
    background: #000;
    position: relative;
  }

  .player-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px 16px 0;
  }

  .player-frame {
    width: 100%;
    aspect-ratio: 16/9;
    background: #050f08;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 0 40px var(--glow);
  }

  .player-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .player-info {
    max-width: 900px;
    margin: 0 auto;
    padding: 10px 16px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .now-playing {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .now-playing-dot {
    width: 8px;
    height: 8px;
    background: var(--red);
    border-radius: 50%;
    animation: pulse 1s infinite;
  }

  .now-playing-name {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }

  .now-playing-cat {
    font-size: 12px;
    color: var(--muted);
  }

  /* GRID */
  main {
    padding: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }

  .ch-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 10px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .ch-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(0,106,78,0.08));
    opacity: 0;
    transition: opacity 0.2s;
  }

  .ch-card:hover::before { opacity: 1; }
  .ch-card:hover {
    border-color: var(--green);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--glow);
  }

  .ch-card.active {
    border-color: #4fffb0;
    background: #0d2018;
    box-shadow: 0 0 20px rgba(79,255,176,0.2);
  }

  .ch-card.active::after {
    content: '▶';
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 9px;
    color: #4fffb0;
  }

  .ch-icon {
    font-size: 28px;
    margin-bottom: 8px;
    display: block;
    line-height: 1;
  }

  .ch-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  .ch-type {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* FOOTER */
  footer {
    background: #060e09;
    border-top: 1px solid var(--border);
    padding: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }

  footer span { color: var(--red); }

  /* MOBILE */
  @media (max-width: 600px) {
    .logo-text { font-size: 18px; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .ch-card { padding: 10px 6px; }
    .ch-icon { font-size: 22px; }
    .ch-name { font-size: 11px; }
  }

  /* NO VIDEO STATE */
  .no-video {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
  }

  .no-video-icon { font-size: 48px; }
  .no-video-text { font-size: 16px; font-weight: 600; }
  .no-video-sub { font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-flag"></div>
    <div class="logo-text">BD <span>লাইভ</span> TV</div>
    <div class="live-badge">LIVE</div>
  </div>
  <div class="header-right">
    <div class="channel-count" id="chCount">২৫+ চ্যানেল</div>
    <a href="https://t.me/arafat2044" target="_blank" style="background:#229ED9;color:#fff;font-family:inherit;font-size:12px;font-weight:700;padding:7px 12px;border-radius:6px;text-decoration:none;display:flex;align-items:center;gap:6px;white-space:nowrap;">✈️ টেলিগ্রাম জয়েন</a>
  </div>
</header>

<div class="categories">
  <button class="cat-btn active" onclick="filterCat('all', this)">সব</button>
  <button class="cat-btn" onclick="filterCat('govt', this)">⚓ সরকারি</button>
  <button class="cat-btn" onclick="filterCat('news', this)">📰 নিউজ</button>
  <button class="cat-btn" onclick="filterCat('entertainment', this)">🎭 বিনোদন</button>
  <button class="cat-btn" onclick="filterCat('sports', this)">⚽ স্পোর্টস</button>
  <button class="cat-btn" onclick="filterCat('islamic', this)">🕌 ইসলামিক</button>
  <button class="cat-btn" onclick="filterCat('kids', this)">👶 শিশু</button>
  <button class="cat-btn" onclick="filterCat('music', this)">🎵 মিউজিক</button>
</div>

<div class="player-section">
  <div class="player-wrap">
    <div class="player-frame" id="playerFrame">
      <div class="no-video">
        <div class="no-video-icon">📺</div>
        <div class="no-video-text">একটি চ্যানেল বেছে নিন</div>
        <div class="no-video-sub">নিচ থেকে যেকোনো চ্যানেলে ক্লিক করুন</div>
      </div>
    </div>
  </div>
  <div class="player-info">
    <div class="now-playing">
      <div class="now-playing-dot"></div>
      <div>
        <div class="now-playing-name" id="playingName">চ্যানেল বাছুন</div>
        <div class="now-playing-cat" id="playingCat">বাংলাদেশ লাইভ TV</div>
      </div>
    </div>
  </div>
</div>

<main id="mainContent"></main>

<footer>
  তৈরি করা হয়েছে <span>❤</span> দিয়ে | BD লাইভ TV &copy; 2025
</footer>

<script>
const channels = [
  // GOVT / SPECIAL CHANNELS
  { name: "বাংলাদেশ নৌবাহিনী", cat: "govt", icon: "⚓", m3u8: "https://owrcovcrpy.gpcdn.net/bpk-tv/1702/output/index.m3u8" },
  { name: "Sangshod TV", cat: "govt", icon: "🏛️", m3u8: "https://owrcovcrpy.gpcdn.net/bpk-tv/1713/output/index.m3u8" },
  { name: "Ekattor TV", cat: "news", icon: "7️⃣1️⃣", m3u8: "https://owrcovcrpy.gpcdn.net/bpk-tv/1705/output/index.m3u8" },
  { name: "Channel 24", cat: "news", icon: "2️⃣4️⃣", m3u8: "https://owrcovcrpy.gpcdn.net/bpk-tv/1703/output/index.m3u8" },
  { name: "Independent TV", cat: "news", icon: "📡", m3u8: "https://owrcovcrpy.gpcdn.net/bpk-tv/1701/output/index.m3u8" },
  { name: "Star News", cat: "news", icon: "⭐", m3u8: "https://owrcovcrpy.gpcdn.net/bpk-tv/1710/output/1710-audio_113402_eng=113200-video=3224800.m3u8" },

  // NEWS
  { name: "ATN News", cat: "news", icon: "📡", ytId: "Gt-RCdORZo0" },
  { name: "Jamuna TV", cat: "news", icon: "🎙️", ytId: "6GKwy8sWFHI" },
  { name: "Somoy TV", cat: "news", icon: "📢", ytId: "UHMFlKfHPsM" },
  { name: "DBC News", cat: "news", icon: "🔔", ytId: "FAZ1RXg1JJg" },
  { name: "Bangla Vision", cat: "news", icon: "👁️", ytId: "L1XkbQ3c61k" },
  { name: "News24", cat: "news", icon: "🔴", ytId: "BdEi5B0qe-k" },

  // ENTERTAINMENT
  { name: "Star Jalsha", cat: "entertainment", icon: "⭐", ytId: "FqOkTJuY_m4" },
  { name: "Zee Bangla", cat: "entertainment", icon: "🌟", ytId: "xjMJkJ7DNSM" },
  { name: "NTV Bangladesh", cat: "entertainment", icon: "🎬", ytId: "3bJXcmqvmfw" },
  { name: "RTV", cat: "entertainment", icon: "🎭", ytId: "HuB0E0X3aBc" },
  { name: "Boishakhi TV", cat: "entertainment", icon: "🌸", ytId: "JznKk6bQj1A" },
  { name: "ATN Bangla", cat: "entertainment", icon: "🎪", ytId: "zJG-YHi0jPk" },
  { name: "Banglavision", cat: "entertainment", icon: "🎥", ytId: "a5ONZV0bHHk" },
  { name: "ETV", cat: "entertainment", icon: "📺", ytId: "FD0b3D1WUTM" },
  { name: "Deepto TV", cat: "entertainment", icon: "💡", ytId: "Wh7MPRFT7-k" },

  // SPORTS
  { name: "T Sports HD", cat: "sports", icon: "🏏", m3u8: "https://tvsen7.aynaott.com/tsports-hd/index.m3u8?e=1779283784&u=78be6644-0a65-48ec-81a4-089ac65a2619&token=3b4c5a2cfa872fa7f91ffbfb4aa0f658" },
  { name: "T Sports", cat: "sports", icon: "📺", ytId: "oqHxMDzpYw0" },
  { name: "BTV Sports", cat: "sports", icon: "⚽", ytId: "jInMdXBQFmo" },
  { name: "Star Sports", cat: "sports", icon: "🏆", ytId: "E75G8_WEuOA" },

  // ISLAMIC
  { name: "Peace TV Bangla", cat: "islamic", icon: "☪️", ytId: "hXx5TFpRjFk" },
  { name: "Islamic TV", cat: "islamic", icon: "📿", ytId: "n8WCWLaJH-4" },

  // KIDS
  { name: "Cartoon Network BD", cat: "kids", icon: "🦄", ytId: "r5rQ-bh5VQs" },
  { name: "Sisimpur (BD)", cat: "kids", icon: "👶", ytId: "Q8RtEQnlGUE" },

  // MUSIC
  { name: "Gaan Bangla", cat: "music", icon: "🎵", ytId: "w_UZiKJhBpo" },
  { name: "Channel i Music", cat: "music", icon: "🎶", ytId: "p8lQ-M3gvGk" },
];

let currentCat = 'all';
let activeCard = null;

function buildGrid() {
  const filtered = currentCat === 'all' ? channels : channels.filter(c => c.cat === currentCat);

  const catMap = {};
  filtered.forEach(ch => {
    if (!catMap[ch.cat]) catMap[ch.cat] = [];
    catMap[ch.cat].push(ch);
  });

  const catLabels = {
    govt: '⚓ সরকারি',
    news: '📰 নিউজ',
    entertainment: '🎭 বিনোদন',
    sports: '⚽ স্পোর্টস',
    islamic: '🕌 ইসলামিক',
    kids: '👶 শিশু',
    music: '🎵 মিউজিক',
  };

  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  for (const cat in catMap) {
    const section = document.createElement('div');

    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = catLabels[cat] || cat;
    section.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';

    catMap[cat].forEach((ch, i) => {
      const card = document.createElement('div');
      card.className = 'ch-card';
      card.dataset.ytId = ch.ytId;
      card.dataset.name = ch.name;
      card.dataset.cat = ch.cat;
      card.innerHTML = `
        <span class="ch-icon">${ch.icon}</span>
        <div class="ch-name">${ch.name}</div>
        <div class="ch-type">${catLabels[ch.cat] || ch.cat}</div>
      `;
      card.addEventListener('click', () => playChannel(ch.ytId, ch.m3u8, ch.name, catLabels[ch.cat], card));
      grid.appendChild(card);
    });

    section.appendChild(grid);
    main.appendChild(section);
  }

  document.getElementById('chCount').textContent = channels.length + '+ চ্যানেল';
}

function playChannel(ytId, m3u8, name, cat, card) {
  if (activeCard) activeCard.classList.remove('active');
  card.classList.add('active');
  activeCard = card;

  document.getElementById('playingName').textContent = name;
  document.getElementById('playingCat').textContent = cat;

  const frame = document.getElementById('playerFrame');

  if (m3u8) {
    // HLS M3U8 stream
    frame.innerHTML = `<video id="hlsVideo" controls autoplay style="width:100%;height:100%;background:#000;"></video>`;
    const video = document.getElementById('hlsVideo');
    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(m3u8);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = m3u8;
      video.play();
    }
  } else {
    // YouTube stream
    frame.innerHTML = `
      <iframe
        src="https://www.youtube.com/embed/live_stream?channel=${ytId}&autoplay=1&mute=0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    `;
  }

  document.querySelector('.player-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildGrid();
}

buildGrid();
</script>
</body>
</html>
